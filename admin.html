<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YRC Admin — Contact Submissions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #050508;
            --panel: rgba(15, 15, 22, 0.95);
            --cyan: #00f0ff;
            --purple: #7000ff;
            --gold: #ffd700;
            --red: #ff003c;
            --green: #00ff88;
            --text: #f0f0f5;
            --muted: #8b8b99;
            --border: rgba(255, 255, 255, 0.06);
            --font-tech: 'Space Grotesk', sans-serif;
            --font-sans: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            min-height: 100vh;
        }

        /* Grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            pointer-events: none;
        }

        /* ── LOGIN SCREEN ── */
        #loginScreen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            z-index: 100;
        }

        .login-box {
            background: var(--panel);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 12px;
            padding: 50px 40px;
            width: 380px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.08);
        }

        .login-box .logo {
            font-family: var(--font-tech);
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .login-box .logo span {
            color: var(--cyan);
        }

        .login-box p {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .login-box input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            font-family: var(--font-sans);
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .login-box input:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--cyan);
            color: #000;
            font-family: var(--font-tech);
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 1px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .login-btn:hover {
            background: #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .login-error {
            color: var(--red);
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
        }

        /* ── MAIN DASHBOARD ── */
        #dashboard {
            display: none;
        }

        header {
            background: rgba(3, 3, 5, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-logo {
            font-family: var(--font-tech);
            font-size: 1.3rem;
            font-weight: 700;
        }

        .header-logo span {
            color: var(--cyan);
        }

        .header-badge {
            font-size: 0.75rem;
            padding: 4px 12px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 20px;
            color: var(--cyan);
            letter-spacing: 1px;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid rgba(255, 0, 60, 0.4);
            color: var(--red);
            padding: 8px 18px;
            border-radius: 6px;
            font-family: var(--font-tech);
            font-size: 0.8rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 0, 60, 0.1);
        }

        .main-content {
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ── STAT CARDS ── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s;
        }

        .stat-card:hover {
            border-color: rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.08);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .stat-icon.cyan {
            background: rgba(0, 240, 255, 0.1);
            color: var(--cyan);
        }

        .stat-icon.gold {
            background: rgba(255, 215, 0, 0.1);
            color: var(--gold);
        }

        .stat-icon.green {
            background: rgba(0, 255, 136, 0.1);
            color: var(--green);
        }

        .stat-value {
            font-family: var(--font-tech);
            font-size: 2rem;
            font-weight: 700;
            line-height: 1;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 4px;
        }

        /* ── TOOLBAR ── */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .toolbar-title {
            font-family: var(--font-tech);
            font-size: 1.2rem;
            font-weight: 600;
        }

        .toolbar-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 6px;
            font-family: var(--font-tech);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }

        .btn-csv {
            background: rgba(0, 255, 136, 0.1);
            color: var(--green);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .btn-csv:hover {
            background: rgba(0, 255, 136, 0.2);
        }

        .btn-json {
            background: rgba(112, 0, 255, 0.1);
            color: #aa55ff;
            border: 1px solid rgba(112, 0, 255, 0.3);
        }

        .btn-json:hover {
            background: rgba(112, 0, 255, 0.2);
        }

        .btn-refresh {
            background: rgba(0, 240, 255, 0.1);
            color: var(--cyan);
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        .btn-refresh:hover {
            background: rgba(0, 240, 255, 0.2);
        }

        /* ── SEARCH BAR ── */
        .search-bar {
            width: 100%;
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .search-bar:focus {
            outline: none;
            border-color: rgba(0, 240, 255, 0.3);
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.05);
        }

        .search-bar::placeholder {
            color: var(--muted);
        }

        /* ── TABLE ── */
        .table-wrap {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead tr {
            background: rgba(0, 240, 255, 0.04);
            border-bottom: 1px solid var(--border);
        }

        thead th {
            padding: 16px 20px;
            text-align: left;
            font-family: var(--font-tech);
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: var(--cyan);
            text-transform: uppercase;
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        tbody td {
            padding: 16px 20px;
            font-size: 0.9rem;
            vertical-align: top;
        }

        .td-num {
            color: var(--muted);
            font-family: var(--font-tech);
            font-size: 0.8rem;
        }

        .td-name {
            font-weight: 500;
            color: #fff;
        }

        .td-email {
            color: var(--cyan);
            font-size: 0.85rem;
        }

        .td-msg {
            color: var(--muted);
            max-width: 350px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        .td-msg:hover {
            color: var(--text);
            white-space: normal;
        }

        .td-date {
            color: var(--muted);
            font-size: 0.8rem;
            white-space: nowrap;
            font-family: var(--font-tech);
        }

        /* Loading / empty states */
        .loading-row td,
        .empty-row td {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(0, 240, 255, 0.1);
            border-top-color: var(--cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: var(--cyan);
            padding: 14px 24px;
            border-radius: 8px;
            font-family: var(--font-tech);
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
            pointer-events: none;
            z-index: 200;
        }

        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
            }

            .main-content {
                padding: 20px;
            }

            .stats-row {
                grid-template-columns: 1fr 1fr;
            }

            table {
                font-size: 0.8rem;
            }

            thead th,
            tbody td {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- ── LOGIN ── -->
    <div id="loginScreen">
        <div class="login-box">
            <div class="logo">YRC<span>_</span></div>
            <p>Admin Access Required</p>
            <input type="password" id="adminPassword" placeholder="Enter admin password"
                onkeydown="if(event.key==='Enter')login()">
            <button class="login-btn" onclick="login()">
                <i class="fas fa-lock" style="margin-right:8px"></i> ACCESS SYSTEM
            </button>
            <p class="login-error" id="loginError">⚠ Incorrect password. Access denied.</p>
        </div>
    </div>

    <!-- ── DASHBOARD ── -->
    <div id="dashboard">
        <header>
            <div style="display:flex;align-items:center;gap:15px">
                <div class="header-logo">YRC<span>_</span>Admin</div>
                <div class="header-badge">SECURE PANEL</div>
            </div>
            <div style="display:flex;align-items:center;gap:15px">
                <span id="lastRefreshed" style="font-size:0.75rem;color:var(--muted)"></span>
                <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> LOGOUT</button>
            </div>
        </header>

        <div class="main-content">

            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-icon cyan"><i class="fas fa-users"></i></div>
                    <div>
                        <div class="stat-value" id="totalCount" style="color:var(--cyan)">—</div>
                        <div class="stat-label">Total Contacts</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon gold"><i class="fas fa-calendar-day"></i></div>
                    <div>
                        <div class="stat-value" id="todayCount" style="color:var(--gold)">—</div>
                        <div class="stat-label">Today</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green"><i class="fas fa-clock"></i></div>
                    <div>
                        <div class="stat-value" id="latestEntry"
                            style="color:var(--green);font-size:1rem;padding-top:4px">—</div>
                        <div class="stat-label">Latest Submission</div>
                    </div>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="toolbar">
                <div class="toolbar-title"><i class="fas fa-database"
                        style="color:var(--cyan);margin-right:10px"></i>Contact Submissions</div>
                <div class="toolbar-actions">
                    <button class="action-btn btn-refresh" onclick="loadContacts()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                    <button class="action-btn btn-csv" onclick="exportCSV()">
                        <i class="fas fa-file-csv"></i> Export CSV
                    </button>
                    <button class="action-btn btn-json" onclick="exportJSON()">
                        <i class="fas fa-file-code"></i> Export JSON
                    </button>
                </div>
            </div>

            <!-- Search -->
            <input type="text" class="search-bar" id="searchInput" placeholder="🔍  Search by name, email or message..."
                oninput="filterTable()">

            <!-- Table -->
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Message</th>
                            <th>Submitted At</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr class="loading-row">
                            <td colspan="5">
                                <div class="spinner"></div>
                                <div>Loading data...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script type="module">
        // ── PASTE YOUR FIREBASE CONFIG HERE (same as in script.js) ──
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_FIREBASE_APP_ID"
        };

        // ── ADMIN PASSWORD (change this!) ──
        const ADMIN_PASSWORD = "yrc@admin2026";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allContacts = [];

        // ── AUTH ──
        window.login = () => {
            const pwd = document.getElementById('adminPassword').value;
            if (pwd === ADMIN_PASSWORD) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadContacts();
            } else {
                document.getElementById('loginError').style.display = 'block';
                document.getElementById('adminPassword').value = '';
            }
        };

        window.logout = () => {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('adminPassword').value = '';
        };

        // ── LOAD DATA ──
        window.loadContacts = () => {
            showLoading();
            const contactsRef = ref(db, 'contacts');
            onValue(contactsRef, (snapshot) => {
                const data = snapshot.val();
                allContacts = [];
                if (data) {
                    Object.entries(data).forEach(([key, val]) => {
                        allContacts.push({ id: key, ...val });
                    });
                    // Sort newest first
                    allContacts.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                }
                renderTable(allContacts);
                updateStats(allContacts);
                document.getElementById('lastRefreshed').textContent =
                    'Refreshed: ' + new Date().toLocaleTimeString('en-IN');
            }, { onlyOnce: true });
        };

        function showLoading() {
            document.getElementById('tableBody').innerHTML = `
        <tr class="loading-row">
            <td colspan="5"><div class="spinner"></div><div>Loading...</div></td>
        </tr>`;
        }

        function renderTable(contacts) {
            const tbody = document.getElementById('tableBody');
            if (contacts.length === 0) {
                tbody.innerHTML = `<tr class="empty-row"><td colspan="5">
            <i class="fas fa-inbox" style="font-size:2rem;margin-bottom:10px;display:block;color:var(--muted)"></i>
            No submissions yet.</td></tr>`;
                return;
            }
            tbody.innerHTML = contacts.map((c, i) => `
        <tr>
            <td class="td-num">${contacts.length - i}</td>
            <td class="td-name">${escHtml(c.name || '—')}</td>
            <td class="td-email"><a href="mailto:${escHtml(c.email)}" style="color:var(--cyan)">${escHtml(c.email || '—')}</a></td>
            <td class="td-msg" title="${escHtml(c.message || '')}">${escHtml(c.message || '—')}</td>
            <td class="td-date">${c.date || formatDate(c.timestamp)}</td>
        </tr>
    `).join('');
        }

        function updateStats(contacts) {
            document.getElementById('totalCount').textContent = contacts.length;

            const today = new Date().toDateString();
            const todayCount = contacts.filter(c => new Date(c.timestamp).toDateString() === today).length;
            document.getElementById('todayCount').textContent = todayCount;

            if (contacts.length > 0) {
                document.getElementById('latestEntry').textContent =
                    contacts[0].name || 'Unknown';
            } else {
                document.getElementById('latestEntry').textContent = 'None yet';
            }
        }

        // ── SEARCH ──
        window.filterTable = () => {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allContacts.filter(c =>
                (c.name || '').toLowerCase().includes(q) ||
                (c.email || '').toLowerCase().includes(q) ||
                (c.message || '').toLowerCase().includes(q)
            );
            renderTable(filtered);
        };

        // ── EXPORT CSV ──
        window.exportCSV = () => {
            if (allContacts.length === 0) { showToast('No data to export!'); return; }
            const headers = ['#', 'Name', 'Email', 'Message', 'Date', 'Timestamp'];
            const rows = allContacts.map((c, i) => [
                allContacts.length - i,
                `"${(c.name || '').replace(/"/g, '""')}"`,
                `"${(c.email || '').replace(/"/g, '""')}"`,
                `"${(c.message || '').replace(/"/g, '""')}"`,
                `"${c.date || ''}"`,
                `"${c.timestamp || ''}"`
            ]);
            const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            downloadFile(csv, `yrc-contacts-${datestamp()}.csv`, 'text/csv');
            showToast('CSV exported successfully!');
        };

        // ── EXPORT JSON ──
        window.exportJSON = () => {
            if (allContacts.length === 0) { showToast('No data to export!'); return; }
            const json = JSON.stringify(allContacts, null, 2);
            downloadFile(json, `yrc-contacts-${datestamp()}.json`, 'application/json');
            showToast('JSON exported successfully!');
        };

        // ── HELPERS ──
        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = Object.assign(document.createElement('a'), { href: url, download: filename });
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function datestamp() {
            return new Date().toISOString().slice(0, 10);
        }

        function formatDate(ts) {
            if (!ts) return '—';
            return new Date(ts).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
        }

        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>

</html>
